# CI for the Relay package and the no-clone installer. It is separate from the
# relay-tui workflows on purpose (ADR-0007): skills/, install.py and .agents/
# are not app/, and app/ has to stay removable.
#
# Repository tooling, not package surface: it only runs when skills/**,
# .agents/tests/** or docs/PROTOCOL.md change.
name: package CI

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.agents/tests/**'
      - 'docs/PROTOCOL.md'
      - 'install.py'
      - '.github/workflows/package-ci.yml'
  pull_request:
    paths:
      - 'skills/**'
      - '.agents/tests/**'
      - 'docs/PROTOCOL.md'
      - 'install.py'
      - '.github/workflows/package-ci.yml'

jobs:
  tests:
    # macOS is the requirement, and it is where `osascript` (iTerm2 and Warp) exists.
    name: .agents/tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill contract (references match docs/PROTOCOL.md, SKILL.md length)
        run: sh .agents/tests/skill-contract.test.sh
      - name: relay-tui-split script
        run: sh .agents/tests/open-split.test.sh
      - name: Relay installer
        run: python3 .agents/tests/install.test.py

  shellcheck:
    # Preinstalled on the Ubuntu runner. Warnings and errors fail; the "info"
    # level flags functions that are called through a variable.
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: find skills .agents/tests -name '*.sh' -print0 | xargs -0 shellcheck -S warning
